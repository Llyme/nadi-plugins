# The plugins of NADI, and the SDK they are written with. Each folder with a manifest.json is one plugin.
#   cargo build --release --target wasm32-unknown-unknown
#   (or: powershell ./build.ps1: every plugin becomes a folder in dist/, ready to be installed from this repository)
[workspace]
members = ["sdk", "audio-meter", "game-clock", "time", "ics-calendar", "busy-meter", "system-meters", "now-playing", "battery", "notification-mirror", "work", "games", "downloads", "claude/sessions", "claude/usage", "page-reader"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
