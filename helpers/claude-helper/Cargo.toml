[package]
name = "claude-helper"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
getrandom = "0.2"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
