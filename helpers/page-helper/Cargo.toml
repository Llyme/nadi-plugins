[package]
name = "page-helper"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "thin"
